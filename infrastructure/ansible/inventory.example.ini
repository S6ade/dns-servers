# Пример inventory-файла для Ansible.
# Скопируйте этот файл в inventory.ini и замените IP-адреса на свои.

[dns_bind]
# Хост для настройки Bind9
bind-vm ansible_host=192.168.1.10 ansible_user=ubuntu

[dns_unbound]
# Хост для настройки Unbound
unbound-vm ansible_host=192.168.1.20 ansible_user=ubuntu

[all:vars]
# Путь к приватному SSH-ключу на вашей локальной машине
ansible_ssh_private_key_file=~/.ssh/id_rsa

# Интерпретатор Python на удаленных хостах (для Ubuntu это /usr/bin/python3)
ansible_python_interpreter=/usr/bin/python3